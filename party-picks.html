<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Manu's Top Party Picks — BM 2026 · theshellpit.com</title>
<link rel="icon" href="assets/terrible-turtle.png">
<style>
  :root {
    --bg: #0d0a08; --bg2: #171008; --card: #1d150c; --card-edge: #3a2712;
    --orange: #ff7a1a; --orange-hot: #ff9d45; --yellow: #ffc93c; --ember: #ff4d00;
    --bone: #f5ead9; --dim: #a08b74; --green: #7bc96f; --pink: #ff6fb7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--bone); font-family: 'Trebuchet MS','Segoe UI',system-ui,sans-serif; min-height: 100vh; overflow-x: hidden; }
  #embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .ember { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--yellow), var(--ember)); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(105vh) scale(1); opacity: 0; } 10% { opacity: .8; } 90% { opacity: .4; } 100% { transform: translateY(-5vh) scale(.3); opacity: 0; } }
  .wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 24px 16px 80px; }
  .back { display: inline-block; color: var(--dim); text-decoration: none; font-size: .85rem; margin-bottom: 8px; }
  .back:hover { color: var(--orange-hot); }
  header { text-align: center; padding: 12px 0 8px; }
  h1 { font-size: clamp(1.7rem, 6vw, 2.8rem); letter-spacing: .08em; background: linear-gradient(180deg, var(--yellow), var(--orange) 60%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; text-transform: uppercase; }
  .sub { color: var(--dim); letter-spacing: .2em; text-transform: uppercase; font-size: .76rem; margin-top: 6px; }
  .credit { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--card-edge); background: var(--card); color: var(--pink); font-size: .82rem; }
  .updated { color: var(--dim); font-size: .72rem; margin-top: 8px; }
  .search { display: block; width: 100%; max-width: 420px; margin: 18px auto 0; padding: 11px 16px; border-radius: 999px; border: 1px solid var(--card-edge); background: var(--card); color: var(--bone); font-size: .95rem; outline: none; }
  .search:focus { border-color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0 6px; }
  .chip { border: 1px solid var(--card-edge); background: var(--card); color: var(--dim); border-radius: 999px; padding: 7px 14px; font-size: .8rem; cursor: pointer; transition: all .15s; user-select: none; }
  .chip:hover { border-color: var(--orange); color: var(--bone); }
  .chip.on { background: linear-gradient(160deg, var(--orange), var(--ember)); color: #1a0d00; border-color: var(--orange); font-weight: 700; }
  .chip.today { border-color: var(--green); }
  .day-h { margin: 30px 0 12px; font-size: 1.1rem; letter-spacing: .1em; text-transform: uppercase; color: var(--orange-hot); display: flex; align-items: center; gap: 10px; }
  .day-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--card-edge), transparent); }
  .day-h .today-tag { font-size: .68rem; color: var(--green); border: 1px solid var(--green); border-radius: 999px; padding: 2px 10px; letter-spacing: .12em; }
  .list { display: grid; gap: 10px; }
  .pick { display: grid; grid-template-columns: 118px 1fr auto; gap: 14px; align-items: center; background: linear-gradient(165deg, var(--card), var(--bg2)); border: 1px solid var(--card-edge); border-radius: 14px; padding: 13px 16px; transition: transform .15s, border-color .15s; }
  .pick:hover { transform: translateX(3px); border-color: var(--orange); }
  .time { color: var(--yellow); font-weight: 800; font-size: .86rem; line-height: 1.35; }
  .artist { font-weight: 700; font-size: .98rem; }
  .camp { color: var(--dim); font-size: .82rem; margin-top: 2px; }
  .by { color: #6f5c48; font-size: .68rem; margin-top: 3px; }
  .where { background: #2c1f10; color: var(--orange-hot); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: .88rem; white-space: nowrap; text-align: center; }
  .where.deep { color: var(--pink); }
  .none { color: var(--dim); font-style: italic; text-align: center; padding: 30px 0; }
  @media (max-width: 560px) { .pick { grid-template-columns: 1fr; gap: 6px; } .where { justify-self: start; } }
  footer { text-align: center; margin-top: 56px; color: #6f5c48; font-size: .76rem; line-height: 1.7; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div id="embers"></div>
<div class="wrap">
  <a class="back" href="index.html">← theshellpit.com</a>
  <header>
    <h1>🎉 Manu's Top Party Picks</h1>
    <div class="sub">Burning Man 2026 · where the music is</div>
    <div class="credit" id="credit"></div>
    <div class="updated" id="updated"></div>
    <input class="search" id="q" type="search" placeholder="🔍 artist, camp, address…">
  </header>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
  <footer>
    🐢 Terrible Turtle Camp · dance responsibly, hydrate religiously<br>
    <a href="kitchen.html">kitchen</a> · <a href="inventory.html">turtle bins</a> · <a href="map.html">camp map</a>
  </footer>
</div>

<script src="data/party-picks.js"></script>
<script>
(function(){
  const em = document.getElementById('embers');
  for (let i=0;i<20;i++){ const e=document.createElement('div'); e.className='ember';
    const s=2+Math.random()*4; e.style.width=e.style.height=s+'px'; e.style.left=Math.random()*100+'vw';
    e.style.animationDuration=(7+Math.random()*10)+'s'; e.style.animationDelay=(Math.random()*12)+'s'; em.appendChild(e); }

  document.getElementById('credit').textContent = PARTY.credit;
  document.getElementById('updated').textContent = '🕐 updated ' + PARTY.updated;
  const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // figure out "today" on playa (Pacific time)
  let todayLabel = null;
  try {
    const pt = new Date(new Date().toLocaleString('en-US', {timeZone:'America/Los_Angeles'}));
    const wd = pt.toLocaleDateString('en-US',{weekday:'long', timeZone:'America/Los_Angeles'});
    const md = pt.toLocaleDateString('en-US',{month:'short', day:'numeric'});
    todayLabel = PARTY.days.find(d => d.startsWith(wd) && d.endsWith(md.replace(/ /g,' ')));
    if (!todayLabel) todayLabel = PARTY.days.find(d => d.startsWith(wd));
  } catch(e){}

  let active = todayLabel || 'all';
  let q = '';
  const chipWrap = document.getElementById('chips');
  function chips(){
    const all = [{k:'all', t:'🌵 All days'}].concat(PARTY.days.map(d=>({k:d, t:d.replace(' · ',' ')})));
    chipWrap.innerHTML = all.map(c=>`<span class="chip ${active===c.k?'on':''} ${c.k===todayLabel?'today':''}" data-k="${esc(c.k)}">${esc(c.t)}${c.k===todayLabel?' 🟢':''}</span>`).join('');
  }
  chipWrap.addEventListener('click', e=>{ const k=e.target.dataset.k; if(!k) return; active=k; chips(); render(); });
  document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.toLowerCase(); render(); });

  function render(){
    const days = active==='all' ? PARTY.days : [active];
    let html = '';
    for (const d of days){
      const picks = PARTY.picks.filter(p => p.day===d && (!q || (p.artist+' '+p.camp+' '+p.where).toLowerCase().includes(q)));
      if (!picks.length) continue;
      html += `<div class="day-h">${esc(d)}${d===todayLabel?'<span class="today-tag">TODAY</span>':''}</div><div class="list">`;
      html += picks.map(p=>`
        <div class="pick">
          <div class="time">${esc(p.time)}</div>
          <div>
            <div class="artist">${esc(p.artist)}</div>
            <div class="camp">${esc(p.camp)}</div>
            ${p.by?`<div class="by">📸 ${esc(p.by)}</div>`:''}
          </div>
          <div class="where ${/deep/i.test(p.where)?'deep':''}">${esc(p.where||'📍 ask around')}</div>
        </div>`).join('');
      html += '</div>';
    }
    document.getElementById('out').innerHTML = html || '<div class="none">nothing matches — the playa provides elsewhere tonight 🐢</div>';
  }
  chips(); render();
})();
</script>
</body>
</html>
